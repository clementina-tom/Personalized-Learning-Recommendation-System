[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plrs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude      = ["anthropic>=0.25"]
openai      = ["openai>=1.0"]
ollama      = ["ollama>=0.2"]
huggingface = ["huggingface_hub>=0.22"]
llm         = ["anthropic>=0.25", "openai>=1.0", "ollama>=0.2", "huggingface_hub>=0.22"]
dev         = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plrs*"]
